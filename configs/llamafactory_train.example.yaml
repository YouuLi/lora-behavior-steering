model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

# Replace this with one registered endpoint dataset.
dataset: alpaca_detail_score1_1k
template: qwen
cutoff_len: 768
max_samples: 844
overwrite_cache: true
preprocessing_num_workers: 2

output_dir: saves/qwen25_05b/lora/detail_score1_seed42
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
fp16: true
seed: 42
val_size: 0

